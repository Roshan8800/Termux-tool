[tool.poetry]
name = "termux-cyber-framework"
version = "0.1.0"
description = "An AI-powered cybersecurity framework for Termux, built with Clean and Hexagonal Architecture."
authors = ["Jules <agent@example.com>"]
readme = "README.md"
packages = [{include = "termux_cyber_framework", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.5.3"
typer = {extras = ["all"], version = "^0.9.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tcf = "termux_cyber_framework.main:main"
