[tool.poetry]
name = "termux-cyber-framework"
version = "0.3.0"
description = "An AI-driven, natural language-powered cybersecurity framework for Termux."
authors = ["Jules <agent@example.com>"]
packages = [{include = "termux_cyber_framework", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pydantic = "^2.5.3"
typer = {extras = ["all"], version = "^0.9.0"}
google-generativeai = "^0.3.2"
rich = "^13.7.0"
fpdf2 = "^2.7.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tcf = "termux_cyber_framework.main:main"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
